ra or later</text><rect x="12" y="873" width="356" height="0.8"/><text x="12" y="886" font-size="12.5" font-weight="400" text-anchor="start">Chips</text><text x="368" y="886" font-size="12.5" font-weight="400" text-anchor="end">Apple silicon + Intel</text><rect x="12" y="893" width="356" height="10"/><text x="12" y="918.5" font-size="10.5"><tspan font-weight="800">INGREDIENTS:</tspan> Swift, AppKit, ApplicationServices, Carbon, Cocoa,</text><text x="12" y="932.0" font-size="10.5" font-weight="400" text-anchor="start">Combine, ServiceManagement, SwiftUI, os.</text><text x="12" y="949.5" font-size="10.5"><tspan font-weight="800">CONTAINS:</tspan> 1 private API (_AXUIElementGetWindow), used to</text><text x="12" y="963.0" font-size="10.5" font-weight="400" text-anchor="start">identify windows. Requires Accessibility permission to move</text><text x="12" y="976.5" font-size="10.5" font-weight="400" text-anchor="start">windows.</text><text x="12" y="995.0" font-size="9.5" font-weight="400" text-anchor="start">* Except a 2-second permission check that stops once Accessibility is</text><text x="12" y="1007.5" font-size="9.5" font-weight="400" text-anchor="start">granted.</text><text x="12" y="1022.0" font-size="9.5" font-weight="400" text-anchor="start">Measured 2026-10-01 on Apple M5, macOS 27.0.1.</text></svg>
